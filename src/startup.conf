description "flogwrite startup"
author "flogwrite"
start on stopped pre-startup
script
  C=/dev/console
  cat /etc/issue > $C 2>/dev/null || echo "  FLOGWRITE" > $C
  echo "[flogwrite] board:  $(crossystem hwid 2>/dev/null | awk '{print $1}')" > $C
  echo "[flogwrite] kernel: $(uname -r)" > $C
  echo "[flogwrite] kernver: $(crossystem tpm_kernver 2>/dev/null)" > $C
  echo "[flogwrite] cpu:    $(grep 'model name' /proc/cpuinfo | head -1 | cut -d: -f2 | sed 's/^ *//')" > $C
  echo "[flogwrite] ram:    $(awk '/MemTotal/{print int($2/1024)}' /proc/meminfo)MB" > $C
  modprobe usb-storage 2>/dev/null || true
  sleep 1
  ## guard: only continue if we are actually on chromeos
  ## crossystem is chromeos-only; if it's missing or /etc/lsb-release has no CHROMEOS_ keys
  ## then factory_install.sh would crash or do nothing useful
  IS_CROS=0
  if command -v crossystem >/dev/null 2>&1; then
    if grep -q "^CHROMEOS_" /etc/lsb-release 2>/dev/null; then
      IS_CROS=1
    fi
  fi
  if [ "$IS_CROS" -ne 1 ]; then
    echo "" > $C
    echo "  [!] FLOGWRITE: this does not appear to be a ChromeOS environment." > $C
    echo "      crossystem or /etc/lsb-release CHROMEOS_ keys missing." > $C
    echo "      factory_install.sh will NOT be launched." > $C
    echo "      Dropping to emergency shell — type 'exit' when done." > $C
    echo "" > $C
    exec /bin/bash
  fi
  exec /usr/sbin/factory_install.sh
end script
